<!DOCTYPE html>
<html>

  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>toshiCare</title>

  <style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-size: 100%;
    font-weight: inherit;
  }

  body {
    background: #fff;
    color: #000;
    width: 100%;
  }

  .text {
    font-family: system-ui;
    font-size: 5.9vw;
    line-height: 7vw;
    font-weight: 700;
    font-variant-ligatures: normal;
  }

  h1, h2 { font: inherit; line-height: inherit; }

  .text p, h1, h2, ul {
    opacity: 0;
    transform: translateY(1.5vw);
    transition: opacity 0.5s ease-out, transform 0.5s ease-out;
    padding: 2.36vw 10vw 3.54vw 3vw;
  }

  .text p.visible, h1.visible, h2.visible, ul.visible {
    opacity: 1;
    transform: translateY(0);
  }

  .text a {
    text-decoration: underline;
    text-decoration-skip: ink;
    color: inherit;
    padding: 0 .5vw;
    margin: 0 -.5vw;
    cursor: pointer;
  }

  .text a:hover { text-decoration: none; }
  .text a:focus { text-decoration: none; outline: solid 4px rgba(0,0,0,.4); }

  ::selection { background: rgba(250,250,250,.99); color: #000; }

  /* Rounded font classes */
  .rounded    { font-family: ui-rounded, system-ui; font-weight: 900; cursor: pointer; }
  .rounded-xl { font-family: ui-rounded, system-ui; font-weight: 900; font-size: 10vw; line-height: 12vw; }
  .rounded-lg { font-family: ui-rounded, system-ui; font-weight: 900; font-size: 8vw;  line-height: 10vw; }

  @keyframes hue-spin {
    from { filter: hue-rotate(0deg); }
    to   { filter: hue-rotate(360deg); }
  }

  .rounded {
    color: #000;
    display: inline-block;
  }

  .rounded:hover {
    color: hsl(0, 100%, 50%);
    animation: hue-spin 1.5s linear infinite;
  }

  /* Spacer between sections */
  .gap { padding: 3vw 0; }

  /* Bullet list */
  ul {
    list-style-type: disc;
    padding: 2vw 10vw 2vw 10vw;
    margin: 0;
  }

  li { padding: 1.5vw 0; }

  /* Footer */
  .footer {
    padding: 4vw 3vw;
    font-size: 2vw;
    font-weight: 400;
    opacity: 0.5;
  }

    overflow: hidden;
  }
