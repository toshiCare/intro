<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Impressum – toshiCare</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: system-ui;
      background: #ffffff;
      color: #000000;
      padding: 5vw;
      font-size: 4vw;
      line-height: 6vw;
      -webkit-user-select: none;
      user-select: none;
    }
    .image-container {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1; 
      max-width: 600px;
      margin-bottom: 4vw;
      background-image: url('Impressum – toshiCare.jpg');
      background-size: contain;
      background-repeat: no-repeat;
      background-position: top left;
    }
    .protection-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0);
      pointer-events: auto;
    }
    .back-link {
      margin-top: 4vw;
    }
    a {
      color: inherit;
      display: inline-block;
      text-decoration: none;
      cursor: pointer;
      -webkit-user-select: auto;
      user-select: auto;
    }
  </style>
</head>
<body>
  <div class="image-container" oncontextmenu="return false;">
    <div class="protection-overlay"></div>
  </div>
  <p class="back-link">
    <a href="index.html">← Zurück</a>
  </p>
</body>
</html>
